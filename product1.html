<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Vintage Clothing Co. - Product 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Holtwood+One+SC&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <nav>
        <div id="nav-left">
            <button id="menu">
                <img src="icons/hamburger.svg" alt="Menu">
            </button>
            <button id="search">
                <img src="icons/search.svg" alt="Search">
            </button>
         </div>
        <a href="index.html" id="nav-logo">
            <img src="brand/submark.svg" alt="American Vintage Clothing Co. Logo">
        </a>
        <div id="nav-right">
            <button id="fav">
                <img src="icons/fav.svg" alt="Favourites">
            </button>
            <button id="bag">
                <img src="icons/bag.svg" alt="Shopping Bag">
            </button>
        </div>
    </nav>
</header>
<main>
    <section id="breadcrumb" class="container">
        <p><a href="index.html">Home</a> > <a href="tees.html">Tees</a> > Product 1</p>
    </section>
    <section id="product" class="container">
        <img src="images/product1_front.png" id="main-product" alt="Product 1 Alt">
        <section id="product-info">
            <h2 id="prod-brand">Product 1 Brand</h2>
            <h2 id="prod-name">Product 1 Name</h2>
            <h3 id="price">$20</h3>    
            <p></p>
        </section>
        <button class="bag-btn">
            <span>Add to bag</span> <span id="btn-price">$20</span>  
        </button>
    </section>
</main>
</body>
</html>
