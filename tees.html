<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Vintage Clothing Co. - Tees</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Holtwood+One+SC&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <nav>
        <div id="nav-left">
            <button id="menu">
                <img src="icons/hamburger.svg" alt="Menu">
            </button>
            <button id="search">
                <img src="icons/search.svg" alt="Search">
            </button>
         </div>
        <a href="index.html" id="nav-logo">
            <img src="brand/submark.svg" alt="American Vintage Clothing Co. Logo">
        </a>
        <div id="nav-right">
            <button id="fav">
                <img src="icons/fav.svg" alt="Favourites">
            </button>
            <button id="bag">
                <img src="icons/bag.svg" alt="Shopping Bag">
            </button>
        </div>
    </nav>
</header>
<main>
    <section id="breadcrumb">
        <p><a href="index.html">Home</a> > New</p>
    </section>
    <section id="products">
        <h1>Tees</h1>
        <section id="product-list">
            <a href="product1.html" class="product-card">
                <div class="card-content">
                    <img src="images/product1_front.png" alt="Grateful Dead Tee">
                    <div class="product-details"><h3>Product 1</h3><p>$20</p></div>
                </div>
            </a>
            <a href="product2.html" class="product-card">
                <div class="card-content">
                    <img src="images/product2.png" alt="Ozzy Osbourne Tee">
                    <div class="product-details"><h3>Product 2</h3><p>$30</p></div>
                </div>
            </a>
    </section>
</main>
</body>
</html>
