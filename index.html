<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Vintage Clothing Co.</title>
</head>
<body>
<header>
    <nav>
        <div id="nav-left">
            <button id="menu">
                <img src="icons/hamburger.svg" alt="Menu">
            </button>
            <button id="search">
                <img src="icons/search.svg" alt="Search">
            </button>
         </div>
        <a href="index.html" id="nav-logo">
            <img src="brand/submark.svg" alt="American Vintage Clothing Co. Logo">
        </a>
        <div id="nav-right">
            <button id="fav">
                <img src="icons/fav.svg" alt="Favourites">
            </button>
            <button id="bag">
                <img src="icons/bag.svg" alt="Shopping Bag">
            </button>
        </div>
    </nav>
</header>
<main>
    <section id="hero">
        <a href="new.html" class="hero-card">
            <div class="index-card-content">
                <span class="card-button">New In</span>
            </div>
        </a>
    </section>
    <section id="sub-cards">
         <a href="tees.html" class="sub-card" id="tees-card">
            <div class="index-card-content">
                <span class="card-button">Tees</span>
            </div>
        </a>
         <a href="denim-jackets.html" class="sub-card" id="denim-jackets-card">
            <div class="index-card-content">
                <span class="card-button">Denim Jackets</span>
            </div>
        </a>
    </section>
    <section id="map" class="info">
        <h1>Visit us</h1>
        <p>Check out the full collections!</p>
        <p>133 Brunswick Street, Fitzroy 3065</p>
    </section>
    <section id="hours" class="info">
        <h1>Opening Hours</h1>
        <p>Mon and Tues - Closed</p>
        <p>Wed to Fri - 11am to 4pm</p>
        <p>Sat - 11am to 4:30pm</p>
        <p>Sun - 12pm to 4pm</p>
    </section>
    <footer>
        Footer Placeholder
    </footer>
</main>
</body>
</html>
